services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - UseHttpsRedirection=false
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/payment.db
    volumes:
      - ./backend/data:/app/data
    networks:
      - tpapp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - tpapp

networks:
  tpapp:
    driver: bridge
